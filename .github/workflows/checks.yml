# Same offline pytest command as tests.yml. A second workflow name is not a second suite.
# This does not install anthropic/openai and does not run examples/real_model_demo.py.
name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install this package and pytest (no model SDKs)
        run: python -m pip install -e ".[dev]"
      - name: Offline pytest
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          ALLOW_WRITES: ""
        run: python -m pytest -q
